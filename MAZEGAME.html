
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="MAZE.css">
  <title>Maze - Navigating Digital Trash</title>
</head>
<body>

<header>
  <ul>
    <li><a href="Maze.html">Exit</a></li>
  </ul>
</header>

<div id="loadingBar">
  <div id="loadingBarEmpty">
    <div id="loadingBarFull"></div>
  </div>
</div>
<div id="warningBanner"></div>

<div id="gameContainer">
  <div id="camera">
    <div id="world">
      <div id="topRow" class="row"></div>
      <div id="middleRow" class="row"></div>
      <div id="bottomRow" class="row"></div>
    </div>
    <div id="player"></div>
  </div>
</div>

<div id="joystickContainer">
  <div id="joystickBase">
    <div id="joystickKnob"></div>
  </div>
</div>

<script>
  const screenshotFiles = [
    'HorizontalWall2.png',
    'horizontalWall3.png',
    'horizontalWall4.png',
    'horizontalWall6.png',
    'horizontalWall7.png',
    'Screenshot 2026-02-26 164550.png',
    'Screenshot 2026-02-26 164602.png',
    'Screenshot 2026-03-05 171025.png',
    'Screenshot 2026-04-21 160319.png',
    'Screenshot 2026-04-30 002433.png',
    'Screenshot 2026-04-30 003937.png',
    'Screenshot 2026-04-30 005530.png',
    'Screenshot 2026-04-30 095832.png',
    'Screenshot 2026-04-30 095838.png',
    'Screenshot 2026-04-30 100032.png',
    'Screenshot 2026-04-30 100206.png',
    'Screenshot 2026-04-30 232622.png',
    'Screenshot 2026-04-30 232847.png',
    'Screenshot 2026-04-30 232901.png',
    'Screenshot 2026-04-30 233523.png',
    'Screenshot 2026-04-30 234222.png',
    'Screenshot 2026-04-30 234235.png',
    'Screenshot 2026-04-30 234307.png',
    'Screenshot 2026-04-30 234315.png',
    'Screenshot 2026-04-30 234831.png',
    'Screenshot 2026-04-30 234914.png',
    'Screenshot 2026-04-30 235822.png',
    'Screenshot 2026-05-01 003853.png',
    'Screenshot 2026-05-01 004345.png',
    'Screenshot 2026-05-01 004534.png',
    'Screenshot 2026-05-01 004823.png',
    'Screenshot 2026-05-01 004856.png',
    'Screenshot 2026-05-01 005644.png',
    'Screenshot 2026-05-01 005707.png',
    'Screenshot 2026-05-01 005805.png',
    'Screenshot 2026-05-01 005925.png',
    'Screenshot 2026-05-01 011254.png',
    'Screenshot 2026-05-01 011342.png',
    'Screenshot 2026-05-01 011458.png'
  ];

const camera = document.getElementById('camera');
const world = document.getElementById('world');
const player = document.getElementById('player');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');

let playerY = 0;
let playerX = 0;
const speed = 6;
const joystickSensitivity = 0.55;
const keys = {};
let joystickActive = false;
let joystickVector = { x: 0, y: 0 };

let obstacles = [];
let gameSpeed = 3;
let currentLane = 1;

let furthestObstacleX = 0;

const usedImages = [...screenshotFiles].sort(() => Math.random() - 0.5);
let imgIndex = 0;

function getNextImage() {
  const img = usedImages[imgIndex % usedImages.length];
  imgIndex++;
  return img;
}

function createObstacle(x, gapLane) {
 

  const lanesY = [
    60,
    camera.clientHeight / 2 - 100,
    camera.clientHeight - 220
  ];

  for (let lane = 0; lane < 3; lane++) {
    if (lane === gapLane) continue;

    const img = document.createElement('img');
    img.src = `MazeScreenshots/${encodeURI(getNextImage())}`;
    img.className = 'wallImage';

    img.style.position = 'absolute';
    img.style.left = x + 'px';
    img.style.top = lanesY[lane] + 'px';

    world.appendChild(img);


    img.onload = () => {
  obstacles.push({
    el: img,
    y: lanesY[lane],
    width: img.offsetWidth,
    height: img.offsetHeight
  });
};
  }

}

function loadLevel() {
  let x = 300;
  let currentLane = 1;

  screenshotFiles.forEach(() => {
    
    const change = Math.floor(Math.random() * 3) - 1;
    currentLane = Math.max(0, Math.min(2, currentLane + change));

    createObstacle(x, currentLane);

    x += 260;
  });
}

function isColliding(x, y) {
  const size = 36;

  const playerRect = {
    left: x,
    right: x + size,
    top: y,
    bottom: y + size
  };

  return obstacles.some(obs => {
    const rect = obs.el.getBoundingClientRect();
    const camRect = camera.getBoundingClientRect();

    const wall = {
      left: rect.left - camRect.left + playerX - camera.clientWidth / 2,
      right: rect.right - camRect.left + playerX - camera.clientWidth / 2,
      top: rect.top - camRect.top,
      bottom: rect.bottom - camRect.top
    };

    return !(
      playerRect.right < wall.left ||
      playerRect.left > wall.right ||
      playerRect.bottom < wall.top ||
      playerRect.top > wall.bottom
    );
  });
}

function gameLoop() {
  updatePlayer();
  updateCamera();
  requestAnimationFrame(gameLoop);
}

function updateCamera() {
  const center = camera.clientWidth / 2;

  player.style.left = center + 'px';
  const offsetX = -playerX + center;
  world.style.left = offsetX + 'px';
}

function setJoystickVector(x, y) {
  const length = Math.hypot(x, y);
  if (length < 1) {
    joystickVector = { x: 0, y: 0 };
    return;
  }
  joystickVector = { x: x / length, y: y / length };
}

function updateJoystick(event) {
  const rect = joystickBase.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const dx = event.clientX - centerX;
  const dy = event.clientY - centerY;
  const maxDistance = rect.width / 2 - 18;
  const distance = Math.min(Math.hypot(dx, dy), maxDistance);
  const angleX = distance > 0 ? dx / distance : 0;
  const angleY = distance > 0 ? dy / distance : 0;
  const knobX = angleX * distance;
  const knobY = angleY * distance;

  setJoystickVector(knobX, knobY);
  joystickKnob.style.transform = `translate(calc(-50% + ${Math.round(knobX)}px), calc(-50% + ${Math.round(knobY)}px))`;
}

function resetJoystick() {
  joystickActive = false;
  joystickVector = { x: 0, y: 0 };
  joystickKnob.style.transform = 'translate(-50%, -50%)';
}

joystickBase.addEventListener('pointerdown', (event) => {
  joystickActive = true;
  joystickBase.setPointerCapture(event.pointerId);
  updateJoystick(event);
});

window.addEventListener('pointermove', (event) => {
  if (!joystickActive) return;
  if (event.pointerType === 'mouse') return;
  updateJoystick(event);
});

window.addEventListener('pointerup', (event) => {
  if (!joystickActive) return;
  resetJoystick();
});

window.addEventListener('pointercancel', () => {
  resetJoystick();
});

document.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

function updatePlayer() {
  let newX = playerX;
  let newY = playerY;
  let movementX = 0;
  let movementY = 0;

  if (keys['arrowleft'] || keys['a']) movementX -= speed;
  if (keys['arrowright'] || keys['d']) movementX += speed;
  if (keys['arrowup'] || keys['w']) movementY -= speed;
  if (keys['arrowdown'] || keys['s']) movementY += speed;

  if (joystickActive) {
    movementX += joystickVector.x * speed * joystickSensitivity;
    movementY += joystickVector.y * speed * joystickSensitivity;
  }

  newX += movementX;
  newY += movementY;
  newY = Math.max(0, Math.min(camera.clientHeight - 40, newY));

  if (!isColliding(newX, newY)) {
    playerX = newX;
    playerY = newY;
  }

  player.style.top = playerY + 'px';
}

loadLevel();
gameLoop();

window.addEventListener('load', () => {
  // initialize player position proportionally to the viewport for small screens
  playerX = camera.clientWidth / 2;
  playerY = camera.clientHeight / 2;
  player.style.top = playerY + 'px';
  // player left is handled in updateCamera but set to center visually
  player.style.left = (camera.clientWidth / 2) + 'px';
});
</script>
</body>
</html>
